# BEACON COMPUTING INITIATIVE
# BCIWhisper Script 58.3 | Engineering Build 2026.10.23-r6.35.3
# Developer Seal: CJB-DEV-2026

name: BCIWhisper 58.3 Complete Refactor Acceptance

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  test-build:
    name: Linux complete modular runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      BCI_DATA_DIR: ${{ runner.temp }}/bciwhisper-data
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-qml-desktop.txt

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            ffmpeg \
            libegl1 \
            libgl1 \
            libportaudio2 \
            portaudio19-dev \
            libxcb-cursor0 \
            libxkbcommon-x11-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements-qml-desktop.txt
          python -m pip install "pyinstaller>=6.16,<7"

      - name: Compile rewritten Python runtime
        run: |
          python -m compileall -q bciwhisper bci_audio bci_core
          python -m py_compile \
            bciwhisper/app/runtime.py \
            bciwhisper/audio/service.py \
            bciwhisper/dsp/engine.py \
            bciwhisper/recording/service.py \
            bciwhisper/processing/service.py \
            bciwhisper/broadcast/service.py \
            bciwhisper/ui_qml/bridge.py

      - name: Enforce complete-refactor boundary
        run: |
          python -m unittest tests.test_refactor_architecture -v
          ! grep -R --include='*.py' -nE             '(^|[[:space:]])(from|import)[[:space:]]+BCIWhisper|PyQt5|PyQt6'             bciwhisper bci_audio bci_core

      - name: Run Python fallback tests
        run: |
          python - <<'PY'
          from bciwhisper.native import native_capabilities
          caps = native_capabilities()
          print(caps)
          assert caps["loaded"] is False
          PY
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Configure C++20 module
        run: |
          cmake -S native -B build/native -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"

      - name: Build C++20 module
        run: cmake --build build/native --config Release --parallel 2

      - name: Verify native runtime and parity
        run: |
          python - <<'PY'
          from bciwhisper.native import native_capabilities
          from bciwhisper.services.native_dsp import NativeDSPService

          caps = native_capabilities()
          print(caps)
          assert caps["loaded"] is True
          assert caps["language"] == "C++20"
          assert caps["abi"] == 1
          assert caps["script"] == "58.2"

          result = NativeDSPService().self_test()
          print(result)
          assert result["ok"] is True
          assert result["backend"] == "C++20"
          PY
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Initialize rewritten application runtime
        run: |
          python - <<'PY'
          from bciwhisper.app import ApplicationRuntime
          runtime = ApplicationRuntime()
          snap = runtime.snapshot()
          print(snap)
          assert snap["phase"] == "starting"
          assert "devices" in snap
          assert "spectrum_db" in snap
          runtime.telemetry.close()
          runtime._executor.shutdown(wait=False, cancel_futures=True)
          PY

      - name: Audio boundary lifecycle smoke
        run: |
          python - <<'PY'
          import time
          from bci_audio.boundary import BCIAudioCaptureSupervisor

          boundary = BCIAudioCaptureSupervisor(block_size=2048)
          boundary.start()
          time.sleep(0.5)
          result = boundary.poll()
          print("pid", boundary.pid)
          print("events", [e.get("type") for e in result.events])
          assert boundary.pid is not None
          boundary.stop()
          assert boundary.pid is None
          PY

      - name: Go Live local gateway integration
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request
          import numpy as np
          from bciwhisper.broadcast.service import BroadcastService

          service = BroadcastService()
          url = service.start(48000)
          print("player", url)

          block = np.zeros(4800, dtype=np.float32)
          for _ in range(4):
              service.publish(block, 48000)
              time.sleep(0.1)

          with urllib.request.urlopen(
              f"http://{service.host}:{service.port}/api/v1/status",
              timeout=2.0,
          ) as response:
              status = json.loads(response.read().decode("utf-8"))

          print(status)
          assert status["stream"]["live"] is True
          assert status["stream"]["publisherInputCodec"] == "pcm_s16le"
          service.shutdown()
          PY

      - name: QML source smoke
        env:
          BCI_QML_SMOKE_TEST: "1"
        run: |
          python -m bciwhisper.ui_qml.main 2>&1 | tee qml-source-smoke.log
          grep -F "[BCIWhisper][QML] ROOT_READY" qml-source-smoke.log
          grep -F "loaded=True" qml-source-smoke.log
          grep -F "self_test=PASS" qml-source-smoke.log

      - name: Build packaged rewritten runtime
        run: pyinstaller --clean -y BCIWhisper-QML.spec

      - name: Packaged QML smoke
        env:
          BCI_QML_SMOKE_TEST: "1"
        run: |
          ./dist/BCIWhisper-58.3/BCIWhisper-58.3 2>&1 | tee qml-package-smoke.log
          grep -F "[BCIWhisper][QML] ROOT_READY" qml-package-smoke.log
          grep -F "loaded=True" qml-package-smoke.log
          grep -F "self_test=PASS" qml-package-smoke.log

      - name: Confirm package excludes PyQt and monolith
        run: |
          test ! -e dist/BCIWhisper-58.3/_internal/PyQt6
          test ! -e dist/BCIWhisper-58.3/_internal/PyQt5
          test ! -e dist/BCIWhisper-58.3/BCIWhisper.py

      - name: Assemble release artifact and evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          cp qml-source-smoke.log release-evidence/
          cp qml-package-smoke.log release-evidence/

          cat > release-evidence/ACCEPTANCE_58_3.txt <<EOF
          BEACON COMPUTING INITIATIVE
          BCIWhisper Script 58.3
          Engineering Build: 2026.10.23-r6.35.3
          Developer Seal: CJB-DEV-2026
          Git commit: ${GITHUB_SHA}

          PASS: production runtime has no BCIWhisper.py import
          PASS: production runtime has no PyQt5/PyQt6 dependency
          PASS: Python fallback module tests
          PASS: C++20 build and pybind11 ABI
          PASS: native DSP parity/self-test
          PASS: recording retention tests
          PASS: reconstruction/mastering tests
          PASS: settings and SQLite WAL telemetry tests
          PASS: isolated audio-process lifecycle smoke
          PASS: Bun/PCM16/MP3 Go Live integration
          PASS: QML source startup
          PASS: PyInstaller full-runtime package
          PASS: packaged QML startup with native C++ active

          Production architecture:
          QML / Qt Quick
            -> PySide6 bridge
            -> Python ApplicationRuntime/services
            -> pybind11
            -> C++20 native primitives
            -> isolated PortAudio input process

          BCIWhisper.py is retained only as a historical/reference implementation.
          EOF

          tar -C dist -czf BCIWhisper-v6.0-Script58.3-Full-Refactor-Linux-x86_64.tar.gz BCIWhisper-58.3
          sha256sum BCIWhisper-v6.0-Script58.3-Full-Refactor-Linux-x86_64.tar.gz \
            > BCIWhisper-v6.0-Script58.3-Full-Refactor-Linux-x86_64.tar.gz.sha256
          sha256sum release-evidence/* > release-evidence/SHA256_EVIDENCE.txt

      - name: Upload accepted artifact
        uses: actions/upload-artifact@v4
        with:
          name: BCIWhisper-v6.0-Script58.3-Full-Refactor-Linux-x86_64
          if-no-files-found: error
          retention-days: 30
          path: |
            BCIWhisper-v6.0-Script58.3-Full-Refactor-Linux-x86_64.tar.gz
            BCIWhisper-v6.0-Script58.3-Full-Refactor-Linux-x86_64.tar.gz.sha256
            release-evidence/

  release:
    name: Publish 58.3 complete refactor preview
    needs: test-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout accepted master
        uses: actions/checkout@v4

      - name: Download accepted artifact
        uses: actions/download-artifact@v4
        with:
          name: BCIWhisper-v6.0-Script58.3-Full-Refactor-Linux-x86_64
          path: release-output

      - name: Publish release if absent
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v6.0-script58.3
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "[BCIWhisper] Release $TAG already exists; leaving it immutable."
            exit 0
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "BCIWhisper v6.0 — Script 58.3 Complete Modular Refactor Preview" \
            --prerelease \
            --notes "BCIWhisper 58.3 replaces the production monolith runtime with QML + Python services + C++20 native primitives. See ACCEPTANCE_58_3.txt for verified scope." \
            release-output/BCIWhisper-v6.0-Script58.3-Full-Refactor-Linux-x86_64.tar.gz \
            release-output/BCIWhisper-v6.0-Script58.3-Full-Refactor-Linux-x86_64.tar.gz.sha256 \
            release-output/release-evidence/ACCEPTANCE_58_3.txt \
            release-output/release-evidence/SHA256_EVIDENCE.txt
