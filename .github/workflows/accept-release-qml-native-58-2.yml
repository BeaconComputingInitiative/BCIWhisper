# BEACON COMPUTING INITIATIVE
# BCIWhisper Script 58.2 | Engineering Build 2026.10.22-r6.35.2
# Developer Seal: CJB-DEV-2026

name: BCIWhisper 58.2 Native Acceptance

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-build:
    name: Linux three-language acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-qml-desktop.txt

      - name: Install system build and Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libegl1 \
            libgl1 \
            libxcb-cursor0 \
            libxkbcommon-x11-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements-qml-desktop.txt
          python -m pip install "pyinstaller>=6.16,<7"

      - name: Compile Python sources
        run: |
          python -m compileall -q bciwhisper
          python -m py_compile bciwhisper/native/adapter.py
          python -m py_compile bciwhisper/services/native_dsp.py
          python -m py_compile bciwhisper/ui_qml/bridge.py

      - name: Run architecture audit
        run: python tools/module_sequence_audit.py

      - name: Verify Python fallback before native build
        run: |
          python - <<'PY'
          from bciwhisper.native import native_capabilities
          caps = native_capabilities()
          print(caps)
          assert caps["loaded"] is False
          PY
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Configure C++20 native module
        run: |
          cmake -S native -B build/native -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"

      - name: Build C++20 native module
        run: cmake --build build/native --config Release --parallel 2

      - name: Verify native ABI and numerical parity
        run: |
          python - <<'PY'
          from bciwhisper.native import NativeAudioAdapter, native_capabilities
          from bciwhisper.services.native_dsp import NativeDSPService

          caps = native_capabilities()
          print(caps)
          assert caps["loaded"] is True
          assert caps["language"] == "C++20"
          assert caps["abi"] == 1
          assert caps["script"] == "58.2"

          service = NativeDSPService()
          result = service.self_test()
          print(result)
          assert result["ok"] is True
          assert result["backend"] == "C++20"

          ring = NativeAudioAdapter().create_ring_buffer(8)
          assert ring.capacity == 8
          PY
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: QML source smoke with native core
        env:
          QT_QPA_PLATFORM: offscreen
          BCI_QML_SMOKE_TEST: "1"
        run: |
          python -m bciwhisper.ui_qml.main 2>&1 | tee qml-source-smoke.log
          grep -F "[BCIWhisper][QML] ROOT_READY" qml-source-smoke.log
          grep -F "loaded=True" qml-source-smoke.log
          grep -F "self_test=PASS" qml-source-smoke.log
          grep -F "backend=C++20 / pybind11" qml-source-smoke.log

      - name: Build Linux three-language preview
        run: pyinstaller --clean -y BCIWhisper-QML.spec

      - name: QML packaged smoke with native core
        env:
          QT_QPA_PLATFORM: offscreen
          BCI_QML_SMOKE_TEST: "1"
        run: |
          ./dist/BCIWhisper-58.2-QML/BCIWhisper-58.2-QML 2>&1 | tee qml-package-smoke.log
          grep -F "[BCIWhisper][QML] ROOT_READY" qml-package-smoke.log
          grep -F "loaded=True" qml-package-smoke.log
          grep -F "self_test=PASS" qml-package-smoke.log
          grep -F "backend=C++20 / pybind11" qml-package-smoke.log

      - name: Assemble release artifact and evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          cp qml-source-smoke.log release-evidence/
          cp qml-package-smoke.log release-evidence/

          cat > release-evidence/ACCEPTANCE_58_2.txt <<EOF
          BEACON COMPUTING INITIATIVE
          BCIWhisper Script 58.2
          Engineering Build: 2026.10.22-r6.35.2
          Developer Seal: CJB-DEV-2026
          Git commit: ${GITHUB_SHA}

          PASS: Python compile
          PASS: module sequence audit
          PASS: Python/NumPy fallback tests
          PASS: C++20 CMake/Ninja build
          PASS: pybind11 ABI verification
          PASS: native numerical parity/self-test
          PASS: native ring-buffer tests
          PASS: QML source root-object smoke with C++20 active
          PASS: PyInstaller Linux build
          PASS: packaged QML root-object smoke with C++20 active

          Architecture:
          QML / Qt Quick -> Python services -> pybind11 -> C++20 primitives

          Scope:
          Three-language modular technology preview. The 57.10 isolated
          PortAudio hardware ownership remains the behavioral compatibility
          baseline until hardware/DSP subsystems are migrated individually.
          EOF

          tar -C dist -czf BCIWhisper-v6.0-Script58.2-QML-Native-Linux-x86_64.tar.gz BCIWhisper-58.2-QML
          sha256sum BCIWhisper-v6.0-Script58.2-QML-Native-Linux-x86_64.tar.gz \
            > BCIWhisper-v6.0-Script58.2-QML-Native-Linux-x86_64.tar.gz.sha256
          sha256sum release-evidence/* > release-evidence/SHA256_EVIDENCE.txt

      - name: Upload accepted artifact
        uses: actions/upload-artifact@v4
        with:
          name: BCIWhisper-v6.0-Script58.2-QML-Native-Linux-x86_64
          if-no-files-found: error
          retention-days: 30
          path: |
            BCIWhisper-v6.0-Script58.2-QML-Native-Linux-x86_64.tar.gz
            BCIWhisper-v6.0-Script58.2-QML-Native-Linux-x86_64.tar.gz.sha256
            release-evidence/

  release:
    name: Publish 58.2 native technology preview
    needs: test-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout accepted master
        uses: actions/checkout@v4

      - name: Download accepted artifact
        uses: actions/download-artifact@v4
        with:
          name: BCIWhisper-v6.0-Script58.2-QML-Native-Linux-x86_64
          path: release-output

      - name: Publish release if absent
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v6.0-script58.2
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "[BCIWhisper] Release $TAG already exists; leaving it immutable."
            exit 0
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "BCIWhisper v6.0 — Script 58.2 Three-Language Native Preview" \
            --prerelease \
            --notes-file docs/BCIWhisper_58_2_Three_Language_Architecture.md \
            release-output/BCIWhisper-v6.0-Script58.2-QML-Native-Linux-x86_64.tar.gz \
            release-output/BCIWhisper-v6.0-Script58.2-QML-Native-Linux-x86_64.tar.gz.sha256 \
            release-output/release-evidence/ACCEPTANCE_58_2.txt \
            release-output/release-evidence/SHA256_EVIDENCE.txt
