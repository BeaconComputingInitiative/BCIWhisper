name: Build Android

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK manager
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -perm -u+x 2>/dev/null | head -1 || true)"
          fi
          test -n "$SDKMANAGER"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          "$SDKMANAGER" --list_installed

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"

          AAPT="$SDK_ROOT/build-tools/36.0.0/aapt"
          test -x "$AAPT"

          echo "=== PACKAGE / BRAND AUDIT ==="
          "$AAPT" dump badging "$APK" | tee /tmp/bci-badging.txt
          grep -q "package: name='org.beaconcomputinginitiative.bciwhisper'" /tmp/bci-badging.txt
          grep -q "application-label:'BCIWhisper'" /tmp/bci-badging.txt

          echo "=== PERMISSION AUDIT ==="
          "$AAPT" dump permissions "$APK" | tee /tmp/bci-permissions.txt

          grep -q "android.permission.RECORD_AUDIO" /tmp/bci-permissions.txt
          grep -q "android.permission.INTERNET" /tmp/bci-permissions.txt
          grep -q "android.permission.ACCESS_NETWORK_STATE" /tmp/bci-permissions.txt
          grep -q "android.permission.FOREGROUND_SERVICE" /tmp/bci-permissions.txt
          grep -q "android.permission.FOREGROUND_SERVICE_MICROPHONE" /tmp/bci-permissions.txt

          ! grep -q "ACCESS_FINE_LOCATION" /tmp/bci-permissions.txt
          ! grep -q "ACCESS_COARSE_LOCATION" /tmp/bci-permissions.txt
          ! grep -q "READ_CONTACTS" /tmp/bci-permissions.txt
          ! grep -q "CAMERA" /tmp/bci-permissions.txt
          ! grep -q "READ_SMS" /tmp/bci-permissions.txt
          ! grep -q "READ_PHONE_STATE" /tmp/bci-permissions.txt
          ! grep -q "READ_MEDIA_" /tmp/bci-permissions.txt
          ! grep -q "READ_EXTERNAL_STORAGE" /tmp/bci-permissions.txt
          ! grep -q "WRITE_EXTERNAL_STORAGE" /tmp/bci-permissions.txt
          ! grep -q "POST_NOTIFICATIONS" /tmp/bci-permissions.txt

      - name: Stage artifact
        run: |
          set -euo pipefail
          mkdir -p android/out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             android/out/BCIWhisper-v6.0-Android-alpha2-debug.apk
          (
            cd android/out
            sha256sum BCIWhisper-v6.0-Android-alpha2-debug.apk \
              > BCIWhisper-v6.0-Android-alpha2-debug.apk.sha256
          )

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BCIWhisper-Android-alpha2
          path: android/out/*
          if-no-files-found: error
          retention-days: 14
