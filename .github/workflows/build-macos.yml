name: Build BCIWhisper for macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release runtime source has not drifted
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          git diff --exit-code             v6.0-script57.10             --             BCIWhisper.py             bci             bci_audio             bci_core             bciwhisper             services             assets/bciwhisper.png

          echo "[PASS] Runtime source matches v6.0-script57.10"

      - name: Verify native architecture
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: ${{ matrix.runner }}"
          echo "Expected: ${{ matrix.arch }}"
          echo "uname: $(uname -m)"
          python3 -c 'import platform; print("Python machine:", platform.machine())'

          case "${{ matrix.arch }}" in
            arm64)
              test "$(uname -m)" = "arm64"
              ;;
            x86_64)
              test "$(uname -m)" = "x86_64"
              ;;
          esac

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-macos-build.txt

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-macos-build.txt
          python -m pip check

      - name: Compile BCI source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile BCIWhisper.py
          python -m py_compile bci_audio/boundary.py
          python -m py_compile bci_core/state.py
          python -m py_compile bciwhisper/config/paths.py

      - name: Build macOS icon
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/bciwhisper.iconset
          mkdir -p build/bciwhisper.iconset

          SOURCE="assets/bciwhisper.png"
          test -f "$SOURCE"

          sips -z 16 16     "$SOURCE" --out build/bciwhisper.iconset/icon_16x16.png >/dev/null
          sips -z 32 32     "$SOURCE" --out build/bciwhisper.iconset/icon_16x16@2x.png >/dev/null
          sips -z 32 32     "$SOURCE" --out build/bciwhisper.iconset/icon_32x32.png >/dev/null
          sips -z 64 64     "$SOURCE" --out build/bciwhisper.iconset/icon_32x32@2x.png >/dev/null
          sips -z 128 128   "$SOURCE" --out build/bciwhisper.iconset/icon_128x128.png >/dev/null
          sips -z 256 256   "$SOURCE" --out build/bciwhisper.iconset/icon_128x128@2x.png >/dev/null
          sips -z 256 256   "$SOURCE" --out build/bciwhisper.iconset/icon_256x256.png >/dev/null
          sips -z 512 512   "$SOURCE" --out build/bciwhisper.iconset/icon_256x256@2x.png >/dev/null
          sips -z 512 512   "$SOURCE" --out build/bciwhisper.iconset/icon_512x512.png >/dev/null
          sips -z 1024 1024 "$SOURCE" --out build/bciwhisper.iconset/icon_512x512@2x.png >/dev/null

          iconutil             -c icns             build/bciwhisper.iconset             -o assets/bciwhisper.icns

          file assets/bciwhisper.icns

      - name: Build application bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build dist

          python -m PyInstaller             --clean             --noconfirm             BCIWhisper-macOS.spec

          test -d dist/BCIWhisper.app
          test -x dist/BCIWhisper.app/Contents/MacOS/BCIWhisper

      - name: Validate Info.plist
        shell: bash
        run: |
          set -euo pipefail

          PLIST="dist/BCIWhisper.app/Contents/Info.plist"

          plutil -lint "$PLIST"

          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")"             = "org.beaconcomputinginitiative.bciwhisper"

          /usr/libexec/PlistBuddy             -c 'Print :NSMicrophoneUsageDescription'             "$PLIST"

      - name: Inspect Mach-O architecture
        shell: bash
        run: |
          set -euo pipefail

          BIN="dist/BCIWhisper.app/Contents/MacOS/BCIWhisper"
          file "$BIN"
          lipo -info "$BIN"

          case "${{ matrix.arch }}" in
            arm64)
              lipo -info "$BIN" | grep -q 'arm64'
              ;;
            x86_64)
              lipo -info "$BIN" | grep -q 'x86_64'
              ;;
          esac

      - name: Ad-hoc sign application
        shell: bash
        run: |
          set -euo pipefail

          codesign             --force             --deep             --sign -             dist/BCIWhisper.app

          codesign             --verify             --deep             --strict             --verbose=2             dist/BCIWhisper.app

      - name: QA graceful-start/shutdown smoke test
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import subprocess
          import sys

          app = "dist/BCIWhisper.app/Contents/MacOS/BCIWhisper"
          env = os.environ.copy()
          env["BCI_QA_AUTOCLOSE_MS"] = "8000"

          try:
              proc = subprocess.run(
                  [app],
                  env=env,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
                  timeout=25,
              )
          except subprocess.TimeoutExpired as exc:
              print(exc.stdout or "")
              print("[FAIL] macOS frozen application did not exit within 25 seconds")
              sys.exit(124)

          print(proc.stdout)
          print(f"MACOS_RELEASE_SMOKE_EXIT={proc.returncode}")

          if proc.returncode != 0:
              sys.exit(proc.returncode)

          required = (
              "[BCI][QA] autoclose timer FIRED",
              "[BCI][SHUTDOWN] closeEvent ENTER",
              "[BCI][SHUTDOWN] closeEvent EXIT accepted",
          )

          missing = [marker for marker in required if marker not in proc.stdout]
          if missing:
              print("[FAIL] Missing graceful-shutdown markers:")
              for marker in missing:
                  print("  ", marker)
              sys.exit(1)

          print("[PASS] macOS frozen graceful shutdown")
          PY

      - name: Create ZIP and DMG
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_BASE="BCIWhisper-v6.0-Script57.10-macOS-${{ matrix.arch }}"

          ditto             -c             -k             --sequesterRsrc             --keepParent             dist/BCIWhisper.app             "${RELEASE_BASE}.zip"

          rm -rf build/dmg-root
          mkdir -p build/dmg-root
          cp -R dist/BCIWhisper.app build/dmg-root/
          ln -s /Applications build/dmg-root/Applications

          hdiutil create             -volname "BCIWhisper"             -srcfolder build/dmg-root             -ov             -format UDZO             "${RELEASE_BASE}.dmg"

          shasum -a 256 "${RELEASE_BASE}.zip" > "${RELEASE_BASE}.zip.sha256"
          shasum -a 256 "${RELEASE_BASE}.dmg" > "${RELEASE_BASE}.dmg.sha256"

          shasum -a 256 -c "${RELEASE_BASE}.zip.sha256"
          shasum -a 256 -c "${RELEASE_BASE}.dmg.sha256"

          ls -lh             "${RELEASE_BASE}.zip"             "${RELEASE_BASE}.zip.sha256"             "${RELEASE_BASE}.dmg"             "${RELEASE_BASE}.dmg.sha256"

      - name: Upload macOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BCIWhisper-macOS-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            BCIWhisper-v6.0-Script57.10-macOS-${{ matrix.arch }}.zip
            BCIWhisper-v6.0-Script57.10-macOS-${{ matrix.arch }}.zip.sha256
            BCIWhisper-v6.0-Script57.10-macOS-${{ matrix.arch }}.dmg
            BCIWhisper-v6.0-Script57.10-macOS-${{ matrix.arch }}.dmg.sha256
