name: Build Signed Android Release

on:
  workflow_dispatch:

jobs:
  signed-release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK manager
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platforms;android-36"             "build-tools;36.0.0"             "ndk;25.2.9519653"             "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Bundle whisper.cpp tiny.en model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets/models
          curl -fL --retry 4             https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin             -o android/app/src/main/assets/models/ggml-tiny.en.bin
          test "$(stat -c%s android/app/src/main/assets/models/ggml-tiny.en.bin)" -gt 1000000

      - name: Materialize release keystore
        shell: bash
        env:
          BCI_ANDROID_KEYSTORE_B64: ${{ secrets.BCI_ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$BCI_ANDROID_KEYSTORE_B64"
          printf '%s' "$BCI_ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/bci-release.jks"
          chmod 600 "$RUNNER_TEMP/bci-release.jks"
          echo "BCI_ANDROID_KEYSTORE=$RUNNER_TEMP/bci-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        env:
          BCI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BCI_ANDROID_KEYSTORE_PASSWORD }}
          BCI_ANDROID_KEY_ALIAS: ${{ secrets.BCI_ANDROID_KEY_ALIAS }}
          BCI_ANDROID_KEY_PASSWORD: ${{ secrets.BCI_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$BCI_ANDROID_KEYSTORE_PASSWORD"
          test -n "$BCI_ANDROID_KEY_ALIAS"
          test -n "$BCI_ANDROID_KEY_PASSWORD"
          gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify signature and package
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"

          APKSIGNER="$SDK_ROOT/build-tools/36.0.0/apksigner"
          AAPT="$SDK_ROOT/build-tools/36.0.0/aapt"

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/signature.txt
          grep -q "Verifies" /tmp/signature.txt

          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='org.beaconcomputinginitiative.bciwhisper'" /tmp/badging.txt
          grep -q "application-label:'BCIWhisper'" /tmp/badging.txt

          sha256sum "$APK" | tee /tmp/BCIWhisper-Android-release.apk.sha256

      - name: Stage signed artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk             dist/BCIWhisper-v6.0-Android-signed-release.apk
          cp /tmp/BCIWhisper-Android-release.apk.sha256             dist/BCIWhisper-v6.0-Android-signed-release.apk.sha256

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: BCIWhisper-Android-signed-release
          path: dist/*
          retention-days: 14
