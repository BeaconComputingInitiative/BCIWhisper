# BEACON COMPUTING INITIATIVE
# BCIWhisper Script 60.0 | Engineering Build 2026.10.23-r6.37.0
# Developer Seal: CJB-DEV-2026

name: BCIWhisper 60.0 Gated Linux Release

on:
  push:
    branches: [master]
    paths: ['.github/workflows/release-podcast-60-0.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-build:
    name: Linux complete modular runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      BCI_DATA_DIR: /tmp/bciwhisper-data
      QT_QPA_PLATFORM: offscreen
      BCI_GATEWAY_URL: ""

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-qml-desktop.txt

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            ffmpeg \
            libegl1 \
            libgl1 \
            libportaudio2 \
            portaudio19-dev \
            libxcb-cursor0 \
            libxkbcommon-x11-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements-qml-desktop.txt
          python -m pip install "pyinstaller>=6.16,<7"

      - name: Compile rewritten Python runtime
        run: |
          python -m compileall -q bciwhisper bci_audio bci_core
          python -m py_compile \
            bciwhisper/app/runtime.py \
            bciwhisper/audio/service.py \
            bciwhisper/dsp/engine.py \
            bciwhisper/recording/service.py \
            bciwhisper/processing/service.py \
            bciwhisper/broadcast/service.py \
            bciwhisper/ui_qml/bridge.py

      - name: Enforce complete-refactor boundary
        run: python -m unittest discover -s tests -p "test_refactor_architecture.py" -v

      - name: Run Python fallback tests
        run: |
          python - <<'PY'
          from bciwhisper.native import native_capabilities
          caps = native_capabilities()
          print(caps)
          assert caps["loaded"] is False
          PY
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Configure C++20 module
        run: |
          cmake -S native -B build/native -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"

      - name: Build C++20 module
        run: cmake --build build/native --config Release --parallel 2

      - name: Verify native runtime and parity
        run: |
          python - <<'PY'
          from bciwhisper.native import native_capabilities
          from bciwhisper.services.native_dsp import NativeDSPService

          caps = native_capabilities()
          print(caps)
          assert caps["loaded"] is True
          assert caps["language"] == "C++20"
          assert caps["abi"] == 1
          assert caps["script"] == "58.3"

          result = NativeDSPService().self_test()
          print(result)
          assert result["ok"] is True
          assert result["backend"] == "C++20"
          PY
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Initialize rewritten application runtime
        run: |
          python - <<'PY'
          from bciwhisper.app import ApplicationRuntime
          runtime = ApplicationRuntime()
          snap = runtime.snapshot()
          print(snap)
          assert snap["phase"] == "starting"
          assert "devices" in snap
          assert "spectrum_db" in snap
          runtime.telemetry.close()
          runtime._executor.shutdown(wait=False, cancel_futures=True)
          PY

      - name: Audio boundary lifecycle smoke
        run: |
          python - <<'PY'
          import time
          from bci_audio.boundary import BCIAudioCaptureSupervisor

          boundary = BCIAudioCaptureSupervisor(block_size=2048)
          boundary.start()
          time.sleep(0.5)
          result = boundary.poll()
          print("pid", boundary.pid)
          print("events", [e.get("type") for e in result.events])
          assert boundary.pid is not None
          boundary.stop()
          assert boundary.pid is None
          PY

      - name: Go Live local gateway integration
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request
          import numpy as np
          from bciwhisper.broadcast.service import BroadcastService

          service = BroadcastService()
          url = service.start(48000)
          print("player", url)

          rate = 48000
          phase = np.arange(4800, dtype=np.float32) / rate
          block = (0.15 * np.sin(2.0 * np.pi * 440.0 * phase)).astype(np.float32)

          status = {}
          deadline = time.monotonic() + 5.0
          while time.monotonic() < deadline:
              service.publish(block, rate)
              time.sleep(0.10)

              with urllib.request.urlopen(
                  f"http://{service.host}:{service.port}/api/v1/status",
                  timeout=2.0,
              ) as response:
                  status = json.loads(response.read().decode("utf-8"))

              if status["stream"]["live"]:
                  break

          print(status)
          assert status["stream"]["publisherInputCodec"] == "pcm_s16le"
          assert status["stream"]["live"] is True
          assert service.stats["bytes_sent"] > 0
          assert service.stats["chunks_sent"] > 0
          service.shutdown()
          PY

      - name: Podcast regression sequences
        run: |
          python -m unittest discover -s tests -p "test_podcast_59_2.py" -v
          python -m unittest discover -s tests -p "test_program_bus_59_3.py" -v

      - name: Timeline and podcast regression tests
        run: |
          python -m unittest discover -s tests -p "test_podcast_59_2.py" -v
          python -m unittest discover -s tests -p "test_program_bus_59_3.py" -v
          python -m unittest discover -s tests -p "test_multitrack_59_6.py" -v
          python -m unittest discover -s tests -p "test_episode_timeline_60_0.py" -v

      - name: QML source smoke
        env:
          BCI_QML_SMOKE_TEST: "1"
        run: |
          python -m bciwhisper.ui_qml.main 2>&1 | tee qml-source-smoke.log
          grep -F "[BCIWhisper][QML] ROOT_READY" qml-source-smoke.log
          grep -F "loaded=True" qml-source-smoke.log
          grep -F "self_test=PASS" qml-source-smoke.log

      - name: Build packaged rewritten runtime
        run: pyinstaller --clean -y BCIWhisper-QML.spec

      - name: Packaged QML smoke
        env:
          BCI_QML_SMOKE_TEST: "1"
        run: |
          ./dist/BCIWhisper-60.0/BCIWhisper-60.0 2>&1 | tee qml-package-smoke.log
          grep -F "[BCIWhisper][QML] ROOT_READY" qml-package-smoke.log
          grep -F "loaded=True" qml-package-smoke.log
          grep -F "self_test=PASS" qml-package-smoke.log

      - name: Frozen multiprocessing must not launch duplicate GUI windows
        env:
          QT_QPA_PLATFORM: offscreen
          BCI_GATEWAY_URL: "wss://example.invalid"
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM --kill-after=2s 8s ./dist/BCIWhisper-60.0/BCIWhisper-60.0 > frozen-spawn-smoke.log 2>&1
          rc=$?
          set -e
          cat frozen-spawn-smoke.log
          if [ "$rc" -ne 124 ] && [ "$rc" -ne 0 ]; then
            echo "Frozen runtime unexpectedly failed with $rc"
            exit 1
          fi
          count=$(grep -c '\[BCIWhisper\]\[QML\] ROOT_READY' frozen-spawn-smoke.log || true)
          test "$count" -eq 1

      - name: Confirm package excludes PyQt and monolith
        run: |
          test ! -e dist/BCIWhisper-60.0/_internal/PyQt6
          test ! -e dist/BCIWhisper-60.0/_internal/PyQt5
          test ! -e dist/BCIWhisper-60.0/BCIWhisper.py

      - name: Assemble acceptance candidate and evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          cp qml-source-smoke.log release-evidence/
          cp qml-package-smoke.log release-evidence/

          cat > release-evidence/ACCEPTANCE_60_0.txt <<EOF
          BEACON COMPUTING INITIATIVE
          BCIWhisper Script 60.0
          Engineering Build: 2026.10.23-r6.37.0
          Developer Seal: CJB-DEV-2026
          Git commit: ${GITHUB_SHA}

          PASS: production runtime has no BCIWhisper.py import
          PASS: production runtime has no PyQt5/PyQt6 dependency
          PASS: Python fallback module tests
          PASS: C++20 build and pybind11 ABI
          PASS: native DSP parity/self-test
          PASS: recording retention tests
          PASS: 59.2 podcast recording and queue tests
          PASS: 59.3 program-bus tests
          PASS: reconstruction/mastering tests
          PASS: settings and SQLite WAL telemetry tests
          PASS: isolated audio-process lifecycle smoke
          PASS: Bun/PCM16/MP3 Go Live integration
          PASS: QML source startup
          PASS: PyInstaller full-runtime package
          PASS: packaged QML startup with native C++ active

          Production architecture:
          QML / Qt Quick
            -> PySide6 bridge
            -> Python ApplicationRuntime/services
            -> pybind11
            -> C++20 native primitives
            -> isolated PortAudio input process

          BCIWhisper.py is retained only as a historical/reference implementation.
          EOF

          tar -C dist -czf BCIWhisper-v6.0-Script60.0-PodcastLab-Studio-Linux-x86_64.tar.gz BCIWhisper-60.0
          sha256sum BCIWhisper-v6.0-Script60.0-PodcastLab-Studio-Linux-x86_64.tar.gz \
            > BCIWhisper-v6.0-Script60.0-PodcastLab-Studio-Linux-x86_64.tar.gz.sha256
          sha256sum release-evidence/* > release-evidence/SHA256_EVIDENCE.txt

      - name: Upload verified release candidate
        uses: actions/upload-artifact@v4
        with:
          name: BCIWhisper-v6.0-Script60.0-PodcastLab-Studio-Linux-x86_64
          if-no-files-found: error
          retention-days: 30
          path: |
            BCIWhisper-v6.0-Script60.0-PodcastLab-Studio-Linux-x86_64.tar.gz
            BCIWhisper-v6.0-Script60.0-PodcastLab-Studio-Linux-x86_64.tar.gz.sha256
            release-evidence/

  publish:
    name: Publish verified 60.0 Linux release
    needs: test-build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BCIWhisper-v6.0-Script60.0-PodcastLab-Studio-Linux-x86_64
          path: release-output
      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v6.0-script60.0
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Existing release $TAG is immutable; no overwrite."
            exit 0
          fi
          cd release-output
          sha256sum -c BCIWhisper-v6.0-Script60.0-PodcastLab-Studio-Linux-x86_64.tar.gz.sha256
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "BCIWhisper Podcast Lab v6.0 — Script 60.0 Studio" \
            --notes "BCIWhisper Script 60.0: secondary capture, two-track recording, nondestructive episode metadata, transcript cue markers and dimensional QML Studio. Independent device clock drift correction and hardware endurance validation remain outstanding. Developer Seal: CJB-DEV-2026." \
            BCIWhisper-v6.0-Script60.0-PodcastLab-Studio-Linux-x86_64.tar.gz \
            BCIWhisper-v6.0-Script60.0-PodcastLab-Studio-Linux-x86_64.tar.gz.sha256 \
            release-evidence/ACCEPTANCE_60_0.txt \
            release-evidence/SHA256_EVIDENCE.txt
