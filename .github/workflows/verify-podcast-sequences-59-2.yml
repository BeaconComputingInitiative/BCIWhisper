# BEACON COMPUTING INITIATIVE
# Podcast Lab 59.2 automated sequence validation
# Developer Seal: CJB-DEV-2026
# SHA-256: calculate on exported evidence
name: BCIWhisper Podcast Five-Stage Verification
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BCI_DATA_DIR: /tmp/bciwhisper-sequence
      BCI_GATEWAY_URL: "wss://example.invalid"
      BCI_PUBLISHER_TOKEN: "testing-not-a-production-token"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0
          python -m pip install -r requirements-qml-desktop.txt
      - name: Compile source modules
        run: python -m compileall -q bciwhisper bci_audio bci_core tests
      - name: Run podcast sequences
        run: python -m unittest discover -s tests -p "test_podcast_59_2.py" -v
      - name: Stage 2 program-bus sequences
        run: python -m unittest discover -s tests -p "test_program_bus_59_3.py" -v
      - name: Stage 3 dual-microphone track alignment
        run: python -m unittest discover -s tests -p "test_multitrack_59_6.py" -v
      - name: Stage 3 and 60.0 episode timeline checks
        run: python -m unittest discover -s tests -p "test_episode_timeline_60_0.py" -v
      - name: Stage 1 QML smoke (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          BCI_QML_SMOKE_TEST: "1"
        run: python -m bciwhisper.ui_qml.main
      - name: Native 3D QML component smoke
        env:
          QT_QPA_PLATFORM: offscreen
          QSG_RHI_BACKEND: software
        run: |
          python - <<'PY'
          from pathlib import Path
          from PySide6.QtCore import QUrl, QObject, Property
          from PySide6.QtGui import QGuiApplication
          from PySide6.QtQml import QQmlComponent, QQmlEngine
          app = QGuiApplication([])
          engine = QQmlEngine()
          class Bridge(QObject):
              @Property(float, constant=True)
              def snrDb(self): return 7.0
              @Property(list, constant=True)
              def spectrumDb(self): return [-65.0] * 128
          bridge = Bridge()
          engine.rootContext().setContextProperty("bci", bridge)
          source = Path("bciwhisper/ui_qml/qml/components/SignalObservatory3D.qml").resolve()
          component = QQmlComponent(engine, QUrl.fromLocalFile(str(source)))
          if component.isError():
              raise RuntimeError(str(component.errors()))
          obj = component.create()
          if obj is None:
              raise RuntimeError(str(component.errors()))
          print("3D QML component parsed and instantiated")
          obj.deleteLater()
          PY
      - name: Integrity record
        if: always()
        run: |
          mkdir -p release-evidence
          {
            echo "BEACON COMPUTING INITIATIVE"
            echo "Developer Seal: CJB-DEV-2026"
            echo "Commit: $GITHUB_SHA"
          } > release-evidence/SEQUENCE_59_2.txt
          sha256sum release-evidence/SEQUENCE_59_2.txt
